name: familyguard
services:
  backend:
    image: familyguard-backend:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PACKAGE_INDEX_URL: ${PACKAGE_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 40s
    environment:
      TRUST_PROXY: "1"
      TRUST_PROXY_NETWORKS: ${FAMILYGUARD_PROXY_IP:-172.30.87.2}/32
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-com.mingyueacai.ios-app-antimiss}
      APNS_ENV: ${APNS_ENV:-sandbox}
    volumes:
      - backend_data:/data
      - ./secrets:/run/secrets:ro
    networks: [app]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8087/health', timeout=3); assert r.status == 200"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    environment:
      SITE_ADDRESS: ${DOMAIN:?Configure the real domain name}
      UPSTREAM: backend:8087
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: {condition: service_healthy}
    networks:
      app:
        ipv4_address: ${FAMILYGUARD_PROXY_IP:-172.30.87.2}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  app:
    ipam:
      config:
        - subnet: ${FAMILYGUARD_SUBNET:-172.30.87.0/24}
volumes:
  backend_data:
  caddy_data:
  caddy_config:
